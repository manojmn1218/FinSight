<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="fsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c26" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Burnt Orange Pop Accent Gradient -->
    <linearGradient id="fsOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45" />
      <stop offset="50%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Warm Cream Typography & Primary Stroke -->
    <linearGradient id="fsCreamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7f3ee" />
    </linearGradient>

    <!-- Dynamic Drop Shadow / Specular Glow -->
    <filter id="fsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#ff6b35" flood-opacity="0.3" />
    </filter>

    <!-- Subtle Internal Radial Ambient Warmth -->
    <radialGradient id="fsAmbient" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Squircle Frame with Luxury Rim -->
  <rect width="100" height="100" rx="24" fill="url(#fsBgGrad)" stroke="rgba(247, 243, 238, 0.12)" stroke-width="1.5" />
  <rect width="100" height="100" rx="24" fill="url(#fsAmbient)" />

  <!-- FinSight Iconic Monogram F -->
  <!-- Left Stem in Warm Cream -->
  <rect x="20" y="20" width="13" height="60" rx="3.5" fill="url(#fsCreamGrad)" />

  <!-- Top Arm with Modern Forward Sweep -->
  <path d="M20 20 h50 c3.5 0 6 2.5 6 6 v1 c0 3.5 -2.5 6 -6 6 h-37 v-13 z" fill="url(#fsCreamGrad)" />

  <!-- Middle Arm (Burnt Orange pop accent) -->
  <path d="M20 42 h28 c3 0 5 2 5 5 v0 c0 3 -2 5 -5 5 h-15 v-10 z" fill="url(#fsOrangeGrad)" />

  <!-- Ascending Analytics Growth Bars in Burnt Orange -->
  <!-- Bar 1 (Short) -->
  <rect x="42" y="62" width="8" height="18" rx="2.5" fill="url(#fsOrangeGrad)" opacity="0.65" />
  
  <!-- Bar 2 (Medium) -->
  <rect x="54" y="50" width="8" height="30" rx="2.5" fill="url(#fsOrangeGrad)" opacity="0.85" />
  
  <!-- Bar 3 (Tall) -->
  <rect x="66" y="38" width="8" height="42" rx="2.5" fill="url(#fsOrangeGrad)" filter="url(#fsGlow)" />

  <!-- Dynamic Upward Trajectory Trendline -->
  <path d="M36 72 L48 60 L60 48 L73 34" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="73" cy="34" r="2.75" fill="#ffffff" />
</svg>

